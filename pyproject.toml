[project]
name = "schooltools"
version = "0.1.0"
description = "Strumenti per gestire gli elenchi degli studenti dal registro Spaggiari"
authors = [{ name = "Nicolò Sala", email = "me@niceo.org" }]
# Unica fonte di verita' per la versione di Python: ruff e ty derivano
# da qui la versione su cui basare i controlli, e uv quale interprete usare.
requires-python = ">=3.14"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx2>=2.12.0",
    "openpyxl>=3.1.5",
]

[tool.uv]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.80",
]

[project.scripts]
schooltools = "schooltools.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=schooltools --cov-report=term-missing"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["schooltools"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
