[project]
name = "schooltools"
version = "0.1.0"
description = "Strumenti per gestire gli elenchi degli studenti dal registro Spaggiari"
authors = [{ name = "Nicolò Sala", email = "me@niceo.org" }]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "beautifulsoup4>=4.11.1",
    "httpx2>=2.12.0",
    "openpyxl>=3.1.5",
]

[tool.uv]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.80",
]

[project.scripts]
schooltools = "schooltools.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"
