version: 2

# Stesso schema per tutti gli ecosistemi: controllo settimanale, minor e patch
# accorpate in un'unica pull request, major separati. Passano tutte dalla CI e,
# se e' verde, vengono mergiate da sole (.github/workflows/automerge.yml): i
# major restano a parte solo per capire a colpo d'occhio chi ha rotto cosa.
updates:
  # Dipendenze Python: e' qui che nascono le vulnerabilita' transitive, come
  # quella di soupsieve. Copre anche ruff, pyrefly, pytest e pre-commit, che il
  # progetto usa come strumenti.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Le action sono pinnate allo SHA del commit nel workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Resta un solo `rev` pinnato, quello di pre-commit-hooks: ruff e uv ora
  # arrivano dall'ambiente del progetto, quindi li aggiorna l'ecosistema uv.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      hooks:
        patterns: ["*"]
        update-types: ["minor", "patch"]
