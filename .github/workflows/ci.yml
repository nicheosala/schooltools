name: CI

on:
  push:
    branches: [main]
  pull_request:

# Il job si limita a leggere il codice: cosi' anche un'action compromessa
# non puo' scrivere sul repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Le action sono pinnate allo SHA del commit, non al tag: un tag e'
      # spostabile dal suo autore, lo SHA no. Dependabot aggiorna SHA e
      # commento insieme.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installa uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --locked fallisce se uv.lock non e' aggiornato rispetto a pyproject.toml,
      # cosi' l'ambiente della CI e' identico a quello di sviluppo.
      - name: Installa le dipendenze
        run: uv sync --locked

      - name: Cache degli ambienti di pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Unica fonte di verita': .pre-commit-config.yaml. Gli hook senza `stages`
      # girano in ogni stage, quindi --hook-stage pre-push li esegue tutti,
      # inclusi ty e pytest.
      - name: Controlli
        run: uv run pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

      # Non e' un hook git: dipende dal database delle vulnerabilita', non dal
      # codice, quindi puo' fallire anche senza modifiche. Resta solo qui.
      - name: Vulnerabilita' nelle dipendenze
        run: uv audit --preview-features audit-command
