name: Automerge

# Parte a CI conclusa, non all'apertura della pull request: cosi' il merge
# avviene solo dopo che i controlli sono passati davvero. Con workflow_run il
# job gira nel contesto del repository, dove il token puo' scrivere; nei
# workflow avviati dalle pull request di Dependabot e' invece di sola lettura.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mergia la pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.workflow_run.pull_requests[0].number }}
        # Il merge puo' fallire se un'altra pull request e' entrata nel
        # frattempo: Dependabot rifa' la sua, la CI riparte e si riprova da se'.
        run: |
          gh pr merge "$NUMERO" --squash --delete-branch --repo "$GITHUB_REPOSITORY" \
            || echo "Merge rimandato: attendo che Dependabot aggiorni la pull request."
