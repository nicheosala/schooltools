name: Automerge

# Parte a CI conclusa, non all'apertura della pull request: cosi' il merge
# avviene solo dopo che i controlli sono passati davvero. Con workflow_run il
# job gira nel contesto del repository, dove il token puo' scrivere; nei
# workflow avviati dalle pull request di Dependabot e' invece di sola lettura.
#
# Le pull request ammesse sono quelle di Dependabot e quelle dell'app
# nicheosala-deps, che apre .github/workflows/lock.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["dependabot[bot]", "nicheosala-deps[bot]"]'), github.event.workflow_run.actor.login) &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mergia la pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.workflow_run.pull_requests[0].number }}
        # Appena finita la CI, GitHub puo' non aver ancora registrato i
        # controlli sul commit e rifiutare il merge: per questo piu' tentativi
        # a distanza di 15 secondi. Se falliscono tutti, di solito e' entrata
        # un'altra pull request nel frattempo: Dependabot rifa' la sua e la CI
        # riparte, quella del lock la rifa' lock.yml il lunedi' dopo.
        run: |
          for _ in 1 2 3 4; do
            gh pr merge "$NUMERO" --squash --delete-branch --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 15
          done
          echo "Merge rimandato: la pull request verra' aggiornata e la CI ripartira'."
