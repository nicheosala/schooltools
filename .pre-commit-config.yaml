# Installa sia l'hook pre-commit sia quello pre-push con un solo `pre-commit install`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^tests/data/
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: ^tests/data/

  # ruff e uv arrivano dall'ambiente del progetto, non da un repo di hook con
  # un `rev` a se': cosi' la versione e' una sola, quella di uv.lock, ed e' la
  # stessa che usano l'editor e la riga di comando.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # Type check e test sono lenti: girano prima del push, non a ogni commit.
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
